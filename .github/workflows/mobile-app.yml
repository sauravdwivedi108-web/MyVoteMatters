name: Mobile app

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MyVoteMatters.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MyVoteMatters-apk
          path: mobile/MyVoteMatters.apk
      - name: Publish to the "mobile-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mobile-latest --yes --cleanup-tag || true
          gh release create mobile-latest MyVoteMatters.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "MyVoteMatters Android (latest test build)" \
            --notes "Test build from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Open this page on your Android phone, download MyVoteMatters.apk and install it (allow installs from your browser when asked)."

  ios:
    name: iOS build check
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for the iOS simulator (no signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
